# Render's free plan puts the service to sleep after 15 minutes without traffic, and waking it
# takes ~50s. Pinging /health every 10 minutes keeps it awake.
#
# Notes:
# - Free for this repo because it's public (Actions minutes are unlimited for public repos).
# - GitHub may delay scheduled runs, so the server can still fall asleep occasionally;
#   the frontend shows a "waking up" banner and retries for that case.
# - GitHub disables scheduled workflows after 60 days without repo activity; re-enable from
#   the Actions tab if that happens.
# - One always-on service uses ~730 of Render's 750 free instance hours per month. Running a
#   second free Render service the same way would exceed that.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            https://kodo-be-cqf5.onrender.com/health
